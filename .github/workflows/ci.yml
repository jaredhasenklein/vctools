name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build the extension zip
        run: bash tools/package-extension.sh
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-web-store-upload
          path: dist/*.zip
          if-no-files-found: error
